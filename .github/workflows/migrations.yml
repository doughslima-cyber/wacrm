name: Migrations

# Replays the schema exactly as Cloud SQL gets it (infra/db/migrate.mjs:
# infra/db/compat, then supabase/migrations, then infra/db/migrations)
# against a clean Postgres 17 with pgvector, then runs
# supabase/ci/verify-schema.sql. No secrets, no Google Cloud: the
# database is a service container on the runner.
#
# Applying to the real Cloud SQL happens in deploy.yml, on push to main.
#
# A migration can apply "successfully" and still do nothing — every DDL
# statement here is IF NOT EXISTS-guarded, which turns a typo'd object
# name into a silent no-op. verify-schema.sql asserts the outcome, not
# just the absence of an error.

on:
  pull_request:
    # NOTE: if this is ever made a REQUIRED status check, drop these
    # filters. GitHub leaves a required check that never ran stuck as
    # "expected", which blocks every PR that doesn't touch SQL.
    paths:
      - 'supabase/**'
      - 'infra/db/**'
      - '.github/workflows/migrations.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'infra/db/**'
      - '.github/workflows/migrations.yml'

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    name: Apply to a clean database
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major as Cloud SQL (wacrm-pg is POSTGRES_17); pgvector
        # for migration 030's `vector` extension.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install infra dependencies
        run: npm ci
        working-directory: infra

      # Twice: the second run must find nothing to apply, which proves
      # the bookkeeping in supabase_migrations.schema_migrations works
      # and a deploy re-running it is harmless.
      - name: Replay every migration from scratch
        run: npm run db:migrate && npm run db:migrate
        working-directory: infra
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
